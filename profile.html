<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>

        ForensicBuzz Profile

    </title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <style>
        body {

            background: #070b16;

            color: white;

            font-family: Arial;

            margin: 0;

        }

        .card {

            width: 400px;

            margin: 50px auto;

            background: #10182b;

            padding: 30px;

            border-radius: 20px;

        }

        button {

            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;

            background: #00e7ff;

            font-size: 18px;

            cursor: pointer;

            border-radius: 12px;

        }

        .info {

            margin: 20px 0;

            font-size: 20px;

        }
    </style>

</head>

<body>

    <div class="card">

        <h1>

            My Profile

        </h1>

        <div id="email" class="info">

            Loading...

        </div>


        <div id="status" class="info">

            Checking...

        </div>


        <button onclick="buy()">

            Subscription Offer


        </button>


        <button id="mockBtn" style="display:none" onclick="openMock()">

            Open Mock Test

        </button>


        <button onclick="logout()">

            Logout

        </button>
        <p id="subscriptionText">
            Checking Subscription...
        </p>

        <button id="mockBtn" style="display:none;" onclick="location.href='mc.html'">

            Open Mock Test

        </button>

    </div>

    <script src="supabase.js"></script>

    <script src="profile.js"></script>

</body>

</html>
