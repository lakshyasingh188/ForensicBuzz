<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ForensicBuzz Test Series</title>

<link rel="stylesheet" href="test-series.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<header class="topbar">

<div class="logo">

<i class="fa-solid fa-flask"></i>

<span>ForensicBuzz Test Series</span>

</div>

<div class="top-actions">

<button id="loginBtn">
<i class="fa-solid fa-user"></i>
Login
</button>

</div>

</header>

<section class="hero">

<h1>
India's Premium Forensic Test Series
</h1>

<p>

Practice Latest Mock Tests, PYQs and Model Papers.

Unlock after payment and instantly download PDF.

</p>

</section>

<section class="search-section">

<div class="search-box">

<i class="fa-solid fa-magnifying-glass"></i>

<input
type="text"
id="searchInput"
placeholder="Search Test Series...">

</div>

</section>

<section class="category-section">

<button class="category active">
All
</button>

<button class="category">
Biology
</button>

<button class="category">
Chemistry
</button>

<button class="category">
Toxicology
</button>

<button class="category">
Fingerprint
</button>

<button class="category">
Cyber
</button>

<button class="category">
DNA
</button>

</section>

<section>

<div
class="cards"
id="testContainer">

<!-- JavaScript Cards -->

</div>

</section>

<div id="previewModal" class="modal">

<div class="modal-content">

<span class="close">&times;</span>

<h2 id="previewTitle"></h2>

<iframe
id="previewFrame"
src=""
frameborder="0">
</iframe>

<div class="modal-buttons">

<button id="buyNowBtn">

<i class="fa-solid fa-lock"></i>

Unlock Test Series

</button>

</div>

</div>

</div>

<div id="loadingScreen">

<div class="loader"></div>

<h2>

Loading Test Series...

</h2>

</div>

<footer>

<div class="footer-content">

<h2>

ForensicBuzz

</h2>

<p>

© 2026 All Rights Reserved

</p>

</div>

</footer>

<script src="test-series.js"></script>

</body>

</html>
