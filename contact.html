<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Tools24</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
}

.container{
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(15px);
    padding:50px;
    border-radius:20px;
    width:90%;
    max-width:650px;
    text-align:center;
    color:white;
    box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.container h1{
    font-size:32px;
    margin-bottom:10px;
}

.container p{
    opacity:0.8;
    margin-bottom:35px;
}

.icons{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:35px;
}

.icons a{
    width:60px;
    height:60px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    font-size:24px;
    color:white;
    text-decoration:none;
    transition:0.4s;
}

.icons a:hover{
    transform:scale(1.15);
}

/* Individual Colors */
.instagram{
    background: linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}

.whatsapp{
    background:rgb(17, 225, 17);
}

.email{
    background:#ea4335;
}

.website{
    background:#00bcd4;
}

.home-btn{
    display:inline-block;
    padding:12px 30px;
    background:#ff9800;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
    transition:0.3s;
}

.home-btn:hover{
    background:#e68900;
    transform:scale(1.05);
}
</style>
</head>

<body>

<div class="container">
    <h1>Contact ForensicBuzz</h1>
    <p>ForensicBuzz.com - India</p>

    <div class="icons">
        <!-- Instagram -->
        <a href="https://www.instagram.com/p/DVNMSooCGEK/?utm_source=ig_web_copy_link" target="_blank" class="instagram">
            <i class="fab fa-instagram"></i>
        </a>

        <!-- WhatsApp Channel -->
        <a href="https://whatsapp.com/channel/0029VbBZBGG8fewxDJKikw3j" target="_blank" class="whatsapp">
            <i class="fab fa-whatsapp"></i>
        </a>

        <!-- Email -->
        <a href="mailto:forensicbuzz.fb@gmail.com" class="email">
            <i class="fas fa-envelope"></i>
        </a>

        <!-- Website (Optional - Change if needed) -->
        <a href="index.html" class="website">
            <i class="fas fa-globe"></i>
        </a>
    </div>

    <a href="index.html" class="home-btn">Back to Home</a>
</div>

</body>
</html>
