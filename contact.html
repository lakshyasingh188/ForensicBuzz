<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us – ForensicBuzz</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ====== RESET ====== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: -apple-system, BlinkMacSystemFont, "San Francisco",
               "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

/* ====== BODY ====== */
body{
  min-height:100vh;
  background: linear-gradient(135deg, #e8ebf0, #f5f7fa);
  display:flex;
  justify-content:center;
  align-items:center;
  color:#111;
}

/* ====== CARD ====== */
.contact-card{
  width:90%;
  max-width:420px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius:20px;
  padding:30px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.12);
  text-align:center;
  animation: fadeIn 0.8s ease;
}

/* ====== TITLE ====== */
.contact-card h1{
  font-size:28px;
  font-weight:600;
  margin-bottom:10px;
}

/* ====== SUBTEXT ====== */
.contact-card p{
  font-size:15px;
  color:#555;
  margin-bottom:25px;
}

/* ====== EMAIL BOX ====== */
.email-box{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
  margin-bottom:20px;
}

/* ====== EMAIL TEXT ====== */
.email-box span{
  display:block;
  font-size:14px;
  color:#777;
  margin-bottom:6px;
}

.email-box a{
  font-size:16px;
  font-weight:500;
  color:#007aff;
  text-decoration:none;
  word-break:break-all;
}

.email-box a:hover{
  text-decoration:underline;
}

/* ====== BUTTON ====== */
.mail-btn{
  display:inline-block;
  margin-top:10px;
  padding:12px 22px;
  background:#007aff;
  color:#fff;
  border-radius:12px;
  font-size:15px;
  font-weight:500;
  text-decoration:none;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 10px 20px rgba(0,122,255,0.3);
}

.mail-btn:hover{
  transform: translateY(-2px);
  box-shadow: 0 14px 26px rgba(0,122,255,0.4);
}

/* ====== FOOTER ====== */
.footer{
  margin-top:25px;
  font-size:13px;
  color:#888;
}

/* ====== ANIMATION ====== */
@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
</style>
</head>

<body>

<div class="contact-card">
  <h1>Contact Us</h1>
  <p>For any queries, suggestions or support</p>

  <div class="email-box">
    <span>Email</span>
    <a href="mailto:forensicbuzz.fb@gmail.com">
      forensicbuzz.fb@gmail.com
    </a>
  </div>

  <a class="mail-btn" href="mailto:forensicbuzz.fb@gmail.com">
    Send Email
  </a>

  <div class="footer">
    © 2026 ForensicBuzz
  </div>
</div>

<script>
  // Future ke liye ready (abhi minimal JS)
  console.log("ForensicBuzz Contact Page Loaded");
</script>

</body>
</html>
